# Picture-in-Picture
window_rule=is_floating:1,title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture|[Кк]артинка в картинке)(.*)$

# System dialogs & tools
window_rule=is_floating:1,app_id:pavucontrol
window_rule=is_floating:1,app_id:pwvucontrol
window_rule=is_floating:1,app_id:blueman-manager
window_rule=is_floating:1,app_id:org.gnome.FileRoller
window_rule=is_floating:1,app_id:gnome-calculator
window_rule=is_floating:1,app_id:qalculate-gtk
window_rule=is_floating:1,app_id:org.gnome.Loupe
window_rule=is_floating:1,app_id:qt5ct
window_rule=is_floating:1,app_id:qt6ct

# Terminal & File Manager opacity defaults
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:kitty
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:ski
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:ski-file-manager

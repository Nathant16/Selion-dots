# █ █ █▀▀ █  █ █▀▀▄  ▀  █▀▀▄ █▀▀▄  ▀  █▀▀▄ █▀▀▀ █▀▀
# █▀▄ █▀▀ █▄▄█ █▀▀▄ ▀█▀ █  █ █  █ ▀█▀ █  █ █ ▀█ ▀▀█
# ▀ ▀ ▀▀▀ ▄▄▄█ ▀▀▀  ▀▀▀ ▀  ▀ ▀▀▀  ▀▀▀ ▀  ▀ ▀▀▀▀ ▀▀▀

# Terminal, File Manager & Task Manager
bind=SUPER,Return,spawn,kitty
bind=SUPER,KP_Enter,spawn,kitty
bind=SUPER,E,spawn,ski
bind=CTRL+SHIFT,Escape,spawn,kitty -e btop

# App Shortcuts (Synchronized with PC / userprefs)
bind=SUPER+SHIFT,C,spawn,code
bind=SUPER+SHIFT,Z,spawn,zen-browser
bind=SUPER+SHIFT,S,spawn,spotify
bind=SUPER+SHIFT,T,spawn,AyuGram
bind=SUPER+SHIFT,G,spawn,steam
bind=SUPER+SHIFT,D,spawn,discord
bind=SUPER+SHIFT,O,spawn,obsidian

# Window Actions
bind=SUPER,Q,killclient
bind=ALT,Return,togglefullscreen
bind=SUPER,space,togglefloating
bind=SUPER,BackSpace,toggle_scratchpad

# Focus & Navigation
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move Windows (Super + Alt + Стрелки)
bind=SUPER+ALT,Left,exchange_client,left
bind=SUPER+ALT,Right,exchange_client,right
bind=SUPER+ALT,Up,exchange_client,up
bind=SUPER+ALT,Down,exchange_client,down

# Workspace Navigation (Super + Ctrl + Стрелки)
bind=SUPER+CTRL,Left,viewtoleft
bind=SUPER+CTRL,Right,viewtoright
bind=SUPER+CTRL,Up,viewtoleft
bind=SUPER+CTRL,Down,viewtoright

# Resize Windows
bind=SUPER+SHIFT,Left,setmfact,-0.05
bind=SUPER+SHIFT,Right,setmfact,+0.05
bind=SUPER+SHIFT,Up,resizewin,+0,-20
bind=SUPER+SHIFT,Down,resizewin,+0,+20

# Shell, Launcher, Clipboard & System Controls
bind=SUPER,A,spawn,serpantinum msg toggle launcher
bind=SUPER,R,spawn,serpantinum reload
bind=SUPER,V,spawn,serpantinum msg toggle clipboard
bind=SUPER,W,spawn,serpantinum msg toggle wallpaper
bind=SUPER,B,spawn,serpantinum msg bar autohide

bind=SUPER,L,spawn,serpantinum lock
bind=NONE,XF86PowerOff,spawn,serpantinum lock

# Screenshots
bind=NONE,Print,spawn,serpantinum screenshot
bind=SHIFT,Print,spawn,serpantinum screenshot --edit
bind=SUPER,Print,spawn,serpantinum screenshot --full
bind=SUPER+SHIFT,Print,spawn,serpantinum screenshot --full --edit

# Hardware & Media Controls
bind=NONE,XF86MonBrightnessDown,spawn,serpantinum brightness lower
bind=NONE,XF86MonBrightnessUp,spawn,serpantinum brightness raise
bind=NONE,XF86AudioLowerVolume,spawn,serpantinum volume lower
bind=NONE,XF86AudioRaiseVolume,spawn,serpantinum volume raise
bind=NONE,XF86AudioMute,spawn,serpantinum volume mute-toggle
bind=NONE,XF86AudioMicMute,spawn,serpantinum volume mic-toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# Workspaces 1..10
bind=SUPER,1,spawn,serpantinum msg workspace 1
bind=SUPER,2,spawn,serpantinum msg workspace 2
bind=SUPER,3,spawn,serpantinum msg workspace 3
bind=SUPER,4,spawn,serpantinum msg workspace 4
bind=SUPER,5,spawn,serpantinum msg workspace 5
bind=SUPER,6,spawn,serpantinum msg workspace 6
bind=SUPER,7,spawn,serpantinum msg workspace 7
bind=SUPER,8,spawn,serpantinum msg workspace 8
bind=SUPER,9,spawn,serpantinum msg workspace 9
bind=SUPER,0,spawn,serpantinum msg workspace 10

bind=SUPER+SHIFT,1,spawn,serpantinum msg workspace 1 move
bind=SUPER+SHIFT,2,spawn,serpantinum msg workspace 2 move
bind=SUPER+SHIFT,3,spawn,serpantinum msg workspace 3 move
bind=SUPER+SHIFT,4,spawn,serpantinum msg workspace 4 move
bind=SUPER+SHIFT,5,spawn,serpantinum msg workspace 5 move
bind=SUPER+SHIFT,6,spawn,serpantinum msg workspace 6 move
bind=SUPER+SHIFT,7,spawn,serpantinum msg workspace 7 move
bind=SUPER+SHIFT,8,spawn,serpantinum msg workspace 8 move
bind=SUPER+SHIFT,9,spawn,serpantinum msg workspace 9 move
bind=SUPER+SHIFT,0,spawn,serpantinum msg workspace 10 move
